<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tease Image Branding Kit | TODAY Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="../../assets/toolbox.css?v=8">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="page-shell">
    <div class="brand-band">
      <img src="../../assets/logo.png?v=3" alt="TODAY" class="site-logo">
      <h1 class="brand-word">Tease Image Branding Kit</h1>
    </div>
    <p class="page-intro">One image or a 2-split at 2400&times;1200 or 1000&times;1000, with a branding bug locked to a bottom corner.</p>
  </header>

  <main class="tool-main">
    <section class="layout-panel" aria-label="Branding options">
      <div class="control-group">
        <span class="control-label">Layout</span>
        <div class="segmented" id="layoutGroup">
          <button type="button" data-value="single" class="active">Single Image</button>
          <button type="button" data-value="split2">2-Split</button>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" for="logoSelect">Logo</label>
        <select class="select-control" id="logoSelect"></select>
      </div>
      <div class="control-group">
        <span class="control-label">Output size</span>
        <div class="segmented" id="sizeGroup">
          <button type="button" data-value="wide" class="active">2400 &times; 1200 (2:1)</button>
          <button type="button" data-value="square">1000 &times; 1000 (1:1)</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Logo corner</span>
        <div class="segmented" id="cornerGroup">
          <button type="button" data-value="bl">Bottom Left</button>
          <button type="button" data-value="br" class="active">Bottom Right</button>
        </div>
      </div>
    </section>

    <section class="upload-row" id="uploadRow" aria-label="Image upload"></section>

    <section class="canvas-wrap">
      <canvas id="canvas" width="2400" height="1200"></canvas>
    </section>

    <section class="export-panel" aria-label="Export">
      <label for="filename">File name</label>
      <input id="filename" type="text" placeholder="tease-image" autocomplete="off">
      <button type="button" id="downloadBtn">Download JPG</button>
    </section>
    <div class="center-row">
      <a class="home-link" href="../index.html">
        <span class="home-link-arrow" aria-hidden="true">&larr;</span>
        <span class="home-link-word">Editorial Templates</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <p>TODAY Toolbox &mdash; internal team tools</p>
  </footer>

  <script src="app.js?v=8"></script>
</body>
</html>

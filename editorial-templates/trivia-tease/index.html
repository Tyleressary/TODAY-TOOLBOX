<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Tease Template | TODAY Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="../../assets/toolbox.css?v=4">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="page-shell">
    <div class="brand-band">
      <img src="../../assets/logo.png?v=3" alt="TODAY" class="site-logo">
      <h1 class="brand-word">Trivia Template</h1>
    </div>
    <p class="page-intro">15-box split &mdash; 5 across &times; 3 down at 2400&times;1200, JPG export.</p>
  </header>

  <main class="tool-main">
    <section class="upload-row" id="uploadRow" aria-label="Image uploads"></section>

    <section class="canvas-wrap">
      <canvas id="canvas" width="2400" height="1200"></canvas>
    </section>
    <p class="hint">Drag an image straight onto a box to upload it, or use the buttons above &mdash; then drag within a box to reposition, and use each slider to zoom.</p>

    <section class="export-panel" aria-label="Export">
      <label for="filename">File name</label>
      <input id="filename" type="text" placeholder="trivia-tease" autocomplete="off">
      <button type="button" id="downloadBtn">Download JPG</button>
    </section>
    <div class="center-row">
      <a class="home-link" href="../index.html">
        <span class="home-link-arrow" aria-hidden="true">&larr;</span>
        <span class="home-link-word">Editorial Templates</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <p>TODAY Toolbox &mdash; internal team tools</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

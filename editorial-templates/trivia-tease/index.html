<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Tease Template | TODAY Toolbox</title>
<link rel="stylesheet" href="../../assets/toolbox.css?v=2">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="site-header tool-header">
    <a class="back-link" href="../index.html">&larr; Editorial Templates</a>
    <img src="../../assets/logo.png?v=3" alt="TODAY" class="site-logo">
    <div>
      <h1>Trivia Tease Template</h1>
      <p class="subtitle">15-box split &mdash; 5 across &times; 3 down at 2400&times;1200, JPG export</p>
    </div>
  </header>

  <main class="tool-main">
    <section class="upload-row" id="uploadRow" aria-label="Image uploads"></section>

    <section class="canvas-wrap">
      <canvas id="canvas" width="2400" height="1200"></canvas>
    </section>

    <section class="export-panel" aria-label="Export">
      <label for="filename">File name</label>
      <input id="filename" type="text" placeholder="trivia-tease" autocomplete="off">
      <button type="button" id="downloadBtn">Download JPG</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>TODAY Toolbox &mdash; internal team tools</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

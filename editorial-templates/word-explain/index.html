<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Explain Template | TODAY Toolbox</title>
<link rel="stylesheet" href="../../assets/toolbox.css?v=3">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header tool-header">
    <a class="back-link" href="../index.html">&larr; Editorial Templates</a>
    <img src="../../assets/logo.png?v=3" alt="TODAY" class="site-logo">
    <div>
      <h1>Word Explain Template</h1>
      <p class="subtitle">Word + underline on a solid background &mdash; 2400&times;1200 or 1000&times;1000, JPG export</p>
    </div>
  </header>

  <main class="tool-main">
    <section class="layout-panel" aria-label="Options">
      <div class="control-group">
        <span class="control-label">Output size</span>
        <div class="segmented" id="sizeGroup">
          <button type="button" data-value="wide" class="active">2400 &times; 1200 (2:1)</button>
          <button type="button" data-value="square">1000 &times; 1000 (1:1)</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Word</span>
        <input id="wordInput" type="text" value="WORD" maxlength="40" autocomplete="off" spellcheck="false">
      </div>
      <div class="control-group">
        <span class="control-label">Word &amp; line color</span>
        <div class="color-row">
          <select id="wordColorSelect" class="color-select" aria-label="Word and underline color"></select>
          <span class="swatch" id="wordColorSwatch"></span>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Background color</span>
        <div class="color-row">
          <select id="bgColorSelect" class="color-select" aria-label="Background color"></select>
          <span class="swatch" id="bgColorSwatch"></span>
        </div>
      </div>
    </section>

    <section class="canvas-wrap">
      <canvas id="canvas" width="2400" height="1200"></canvas>
    </section>

    <section class="export-panel" aria-label="Export">
      <label for="filename">File name</label>
      <input id="filename" type="text" placeholder="word-explain" autocomplete="off">
      <button type="button" id="downloadBtn">Download JPG</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>TODAY Toolbox &mdash; internal team tools</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

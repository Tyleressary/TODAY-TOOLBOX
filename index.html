<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODAY Toolbox</title>
<link rel="stylesheet" href="assets/toolbox.css">
</head>
<body>
  <header class="site-header">
    <img src="assets/logo.png" alt="TODAY" class="site-logo">
    <div>
      <h1>TODAY Toolbox</h1>
      <p class="subtitle">In-house graphic &amp; production tools for the team</p>
    </div>
  </header>

  <main class="tool-grid">
    <a class="tool-card" href="split-image/index.html">
      <div class="tool-card-thumb split-thumb" aria-hidden="true">
        <svg viewBox="0 0 240 120" preserveAspectRatio="none">
          <rect x="0" y="0" width="76" height="120" fill="#ff513c"/>
          <rect x="80" y="0" width="76" height="120" fill="#4a515c"/>
          <rect x="160" y="0" width="80" height="120" fill="#abb4c2"/>
        </svg>
      </div>
      <div class="tool-card-body">
        <h2>Split Image Generator</h2>
        <p>Build 2, 3, or 4-way split graphics at 2400&times;1200 or a 1000&times;1000 square, then export as a JPG.</p>
      </div>
    </a>

    <div class="tool-card tool-card-placeholder" aria-hidden="true">
      <div class="tool-card-body">
        <h2>More tools coming soon</h2>
        <p>This toolbox will grow with more team tools over time.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>TODAY Toolbox &mdash; internal team tools</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Image Generator | TODAY Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="../assets/toolbox.css?v=4">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="page-shell">
    <div class="brand-band">
      <img src="../assets/logo.png?v=3" alt="TODAY" class="site-logo">
      <h1 class="brand-word">Split Image Template</h1>
    </div>
    <p class="page-intro">Split graphics &mdash; 2400&times;1200, 1920&times;1080, or 1000&times;1000, JPG export.</p>
  </header>

  <main class="tool-main">
    <section class="layout-panel" aria-label="Layout options">
      <div class="control-group">
        <span class="control-label">Splits</span>
        <div class="segmented" id="splitsGroup">
          <button type="button" data-value="2" class="active">2-Split</button>
          <button type="button" data-value="3">3-Split</button>
          <button type="button" data-value="4">4-Split</button>
          <button type="button" data-value="4g">4-Split (Grid)</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Output size</span>
        <div class="segmented" id="sizeGroup">
          <button type="button" data-value="wide" class="active">2400 &times; 1200 (2:1)</button>
          <button type="button" data-value="hd">1920 &times; 1080 (16:9)</button>
          <button type="button" data-value="square">1000 &times; 1000 (1:1)</button>
        </div>
      </div>
    </section>

    <section class="upload-row" id="uploadRow" aria-label="Image uploads"></section>

    <section class="canvas-wrap">
      <canvas id="canvas" width="2400" height="1200"></canvas>
    </section>
    <p class="hint">Drag an image straight onto a panel to upload it, or use the buttons above &mdash; then drag within a panel to reposition, and use each slider to zoom.</p>

    <section class="export-panel" aria-label="Export">
      <label for="filename">File name</label>
      <input id="filename" type="text" placeholder="split-image" autocomplete="off">
      <button type="button" id="downloadBtn">Download JPG</button>
    </section>
    <div class="center-row">
      <a class="home-link" href="../editorial-templates/index.html">
        <span class="home-link-arrow" aria-hidden="true">&larr;</span>
        <span class="home-link-word">Editorial Templates</span>
      </a>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
